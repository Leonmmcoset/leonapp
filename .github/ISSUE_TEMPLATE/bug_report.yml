name: Bug报告
about: 创建一个Bug报告以帮助我们改进
title: '[BUG] '
labels: bug
assignees: ''

body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述这个Bug是什么
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 复现这个Bug的步骤
      placeholder: |
        1. 打开页面 '...'
        2. 点击 '....'
        3. 滚动到 '....'
        4. 看到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 清晰简洁地描述你期望发生的事情
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 清晰简洁地描述实际发生的事情
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果适用，添加截图以帮助解释你的问题
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供你的环境信息
      placeholder: |
        操作系统: Windows 10
        浏览器: Chrome 90.0.4430.212
        设备: 桌面
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 在此处添加有关问题的任何其他上下文
    validations:
      required: false