name: 功能请求
about: 为这个项目提出一个想法
title: '[FEATURE] '
labels: enhancement
assignees: ''

body:
  - type: textarea
    id: feature_description
    attributes:
      label: 功能描述
      description: 清晰简洁地描述你想要的功能是什么
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 描述这个功能将如何被使用，以及它解决了什么问题
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: 可能的实现方式
      description: 如果你有想法，描述你希望这个功能如何实现
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的任何替代解决方案或功能
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 在此处添加有关功能请求的任何其他上下文或截图
    validations:
      required: false